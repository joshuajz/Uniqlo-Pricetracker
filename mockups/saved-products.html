</style></head><body>
<div class="review"><div><strong>Saved products · Design preview</strong> <span>Sample prices · Try saving, removing, and refreshing.</span></div><div class="review-actions"><button id="empty-preview">Empty state</button><button id="reset">Reset demo</button></div></div>
<nav class="site-nav" aria-label="Main navigation"><a href="#browse" class="brand">UNIQLO<span>PRICE TRACKER</span></a><div class="nav-links"><button data-view="browse">Deals</button><button data-view="browse">All products</button><button data-view="saved">Saved <span class="nav-count" id="saved-count">4</span></button></div><div class="market"><span class="flag" aria-hidden="true">🇨🇦</span><div><strong>Canada</strong><small>CAD · BEFORE TAX</small></div></div></nav>
<main class="container" id="main"></main><footer><span>Independent tracker · Not affiliated with Uniqlo</span><span>Prices checked daily · Confirm prices and sizes on Uniqlo.</span></footer><div class="toast" role="status" id="toast" hidden></div>
<script>
const products=[{"id": "E488228-000", "name": "Turtleneck Long Sleeve T-Shirt", "price": 39.9, "regular": 49.9, "dept": "men", "image": "saved-products-assets/0.jpg"}, {"id": "E460318-000", "name": "Waffle Crew Neck T-Shirt", "price": 24.9, "regular": 34.9, "dept": "men", "image": "saved-products-assets/1.jpg"}, {"id": "E482766-000", "name": "Waffle Henley Neck T-Shirt | Long Sleeve", "price": 29.9, "regular": 29.9, "dept": "men", "image": "saved-products-assets/2.jpg"}, {"id": "E485321-000", "name": "Women 3D Knit Merino Blend Polo Sweater", "price": 59.9, "regular": 69.9, "dept": "women", "image": "saved-products-assets/3.jpg"}, {"id": "E465193-000", "name": "AIRism Cotton T-Shirt | Long Sleeve", "price": 29.9, "regular": 39.9, "dept": "men", "image": "saved-products-assets/4.jpg"}, {"id": "E482321-000", "name": "Washable 3D Knit Crew Neck Sweater", "price": 59.9, "regular": 69.9, "dept": "women", "image": "saved-products-assets/5.jpg"}];
const savedPrices=[49.9,34.9,29.9,49.9];const key='uniqlo-saved-design-demo-v1';const icon='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';const arrow='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>';const device='<svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="1"/><path d="M8 21h8m-4-5v5"/></svg>';const cross='<svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>';
const seed=()=>products.slice(0,4).map((p,i)=>({id:p.id,price:savedPrices[i]}));let storageWorks=true,saved;try{const raw=localStorage.getItem(key);saved=raw?JSON.parse(raw):seed();if(!Array.isArray(saved)||saved.some(s=>!products.some(p=>p.id===s.id)||!Number.isFinite(s.price)))saved=seed()}catch{saved=seed();storageWorks=false}let view='saved',filter='all',sort='saved',selected=products[0],emptyPreview=false,timer;const $=s=>document.querySelector(s);const money=n=>'$'+n.toFixed(2);const isSaved=id=>saved.some(s=>s.id===id);function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{storageWorks=false}}function notify(message,undo){clearTimeout(timer);$('#toast').hidden=false;$('#toast').replaceChildren();const span=document.createElement('span');span.textContent=message;$('#toast').append(span);if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();persist();render();$('#toast').hidden=true};$('#toast').append(b)}timer=setTimeout(()=>$('#toast').hidden=true,4500)}function toggle(id){emptyPreview=false;const old=saved.find(s=>s.id===id);if(old){const index=saved.indexOf(old);saved=saved.filter(s=>s.id!==id);notify('Removed from Saved',()=>saved.splice(index,0,old))}else{saved.push({id,price:products.find(p=>p.id===id).price});notify('Added to Saved')}persist();render()}
function change(p,s){const delta=p.price-s.price;return '<div class="change '+(delta<0?'down':'')+'"><strong>'+(delta<0?'↓ '+money(-delta)+' lower':delta>0?'↑ '+money(delta)+' higher':'No change')+'</strong><small>'+money(s.price)+' when saved'+(delta===0?'':' · '+Math.round(Math.abs(delta)/s.price*100)+'% '+(delta<0?'lower':'higher'))+'</small></div>'}function price(p){return '<div class="current"><strong>'+money(p.price)+'</strong><div class="typical">Typical '+money(p.regular)+'</div></div>'}function productLink(p){return '<a class="product-link" href="#product/'+p.id+'">'+p.name+'</a>'}function empty(filtered){return '<div class="empty"><div class="empty-icon">'+icon+'</div><h2>'+(filtered?'No price drops yet.':'Keep an eye on your favourites.')+'</h2><p>'+(filtered?'Your saved products haven’t dropped below their price when saved. Check back after the next price update.':'Save products as you browse. Come back here to see their latest prices and what’s changed.')+'</p><button class="primary" data-action="'+(filtered?'all':'browse')+'">'+(filtered?'Show all saved':'Browse products')+' '+arrow+'</button></div>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#saved-count').textContent=saved.length;$('#empty-preview').textContent=emptyPreview?'Exit empty state':'Empty state';let body='';if(view==='saved'){let items=emptyPreview?[]:saved.slice().reverse().map(s=>({s,p:products.find(p=>p.id===s.id)}));const drops=items.filter(x=>x.p.price<x.s.price).length;const count=items.length;if(filter==='drops')items=items.filter(x=>x.p.price<x.s.price);if(sort==='price')items.sort((a,b)=>a.p.price-b.p.price);if(sort==='drop')items.sort((a,b)=>(a.p.price-a.s.price)-(b.p.price-b.s.price));body='<div class="heading"><div><p class="eyebrow">Your watchlist · Canada</p><h1>Saved<span> for later.</span></h1><p class="intro">The pieces you’re watching. The prices they’re at now.</p></div><button class="secondary" data-action="browse">Browse products '+arrow+'</button></div><p class="device-note">'+device+'<span><strong>Saved in this browser.</strong> No account needed. Your list won’t sync to other devices.</span></p>';if(count){body+='<div class="toolbar"><div class="tabs"><button data-filter="all" aria-pressed="'+(filter==='all')+'">All saved <small>'+count+'</small></button><button data-filter="drops" aria-pressed="'+(filter==='drops')+'">Price drops <small>'+drops+'</small></button></div><label class="sort">Sort by <select id="sort"><option value="saved">Recently saved</option><option value="drop">Biggest price drop</option><option value="price">Lowest price</option></select></label></div>';if(items.length)body+='<div class="column-head" aria-hidden="true"><span>Product</span><span>Current price · CAD</span><span>Since you saved</span><span></span></div>'+items.map(({p,s})=>'<article class="saved-row"><div class="identity"><a href="#product/'+p.id+'" tabindex="-1" aria-hidden="true"><img src="'+p.image+'" alt=""></a><div>'+productLink(p)+'<p class="meta">'+(p.dept==='men'?'Men':'Women')+' · '+p.id+'</p>'+(p.price<p.regular?'<span class="badge">Below typical price</span>':'')+'</div></div>'+price(p)+change(p,s)+'<button class="remove" data-save="'+p.id+'" aria-label="Remove '+p.name+' from Saved">'+cross+' Remove</button></article>').join('');else body+=empty(true);body+='<div class="freshness"><p><span class="dot"></span>Sample prices · Last checked Oct 6, 2026</p><p>Changes compare the latest recorded price with the price when you saved the product.</p></div>'}else body+=empty(false)}else if(view==='browse'){body='<p class="eyebrow">Uniqlo Canada · All products</p><h1>Find it.<span> Save it.</span></h1><p class="intro">Save a product to keep its price in view.</p><div class="grid">'+products.map(p=>'<article class="card"><a href="#product/'+p.id+'" tabindex="-1" aria-hidden="true"><img class="card-image" src="'+p.image+'" alt=""></a><button class="bookmark" data-save="'+p.id+'" aria-pressed="'+isSaved(p.id)+'" aria-label="'+(isSaved(p.id)?'Remove '+p.name+' from Saved':'Save '+p.name)+'">'+icon+'</button><div class="card-copy">'+productLink(p)+'<p class="meta">'+p.dept+' · T-shirts & knitwear</p>'+(p.price<p.regular?'<span class="badge">Below typical price</span>':'')+'</div><div class="card-price"><strong>'+money(p.price)+'</strong><del>'+money(p.regular)+'</del></div></article>').join('')+'</div>'}else{const p=selected;const s=saved.find(s=>s.id===p.id);body='<button class="detail-back" data-action="saved">← Back to Saved</button><article class="detail"><img class="detail-image" src="'+p.image+'" alt="'+p.name+'"><div><p class="eyebrow">'+p.dept+' · '+p.id+'</p><h1>'+p.name+'</h1><div class="detail-price">'+money(p.price)+'<span>CAD</span></div><p class="meta">Typical tracked price '+money(p.regular)+'</p><div class="verdict"><strong>'+(p.price<p.regular?'Below typical price':'At typical price')+'</strong><small>'+(p.price<p.regular?'Save '+money(p.regular-p.price)+' compared with typical':'Lowest price and history are shown below')+'</small></div><div class="detail-actions"><button class="primary" id="store-preview">Check sizes on Uniqlo ↗</button><button class="secondary detail-save" data-save="'+p.id+'" aria-pressed="'+!!s+'">'+icon+' '+(s?'Saved':'Save product')+'</button></div><p class="detail-note">Saved in this browser. No account needed.</p>'+(s?'<div style="margin-top:24px">'+change(p,s)+'</div>':'')+'<div class="detail-facts"><span>Checked<br><strong>Oct 6, 2026</strong></span><span>Tracking since<br><strong>Sep 13, 2026</strong></span></div></div></article><section class="history"><h2>Recorded price history</h2><p class="meta">Illustrative history for this design preview</p><svg class="history-chart" viewBox="0 0 1100 180" preserveAspectRatio="none" aria-label="Illustrative price history"><line x1="40" y1="35" x2="1060" y2="35"/><line x1="40" y1="110" x2="1060" y2="110"/><path d="M40 35H400V65H700V110H1060"/><text x="40" y="162">Sep 13</text><text x="520" y="162">Sep 25</text><text x="990" y="162">Oct 6</text></svg></section>'}$('#main').innerHTML=(!storageWorks?'<p class="storage-warning" role="status">Browser storage is unavailable. Saved products will only stay while this page is open.</p>':'')+body;document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggle(b.dataset.save));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='all'){filter='all';render()}else navigate(b.dataset.action)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if($('#sort')){$('#sort').value=sort;$('#sort').onchange=e=>{sort=e.target.value;render()}}if($('#store-preview'))$('#store-preview').onclick=()=>notify('Design preview · Store link will open Uniqlo in the app.');}
function navigate(next){location.hash=next}function route(){const hash=location.hash.slice(1);if(hash.startsWith('product/')){selected=products.find(p=>p.id===hash.slice(8))||products[0];view='product'}else view=hash==='browse'?'browse':'saved';render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#empty-preview').onclick=()=>{emptyPreview=!emptyPreview;view='saved';filter='all';if(location.hash==='#saved'||!location.hash)render();else navigate('saved')};$('#reset').onclick=()=>{saved=seed();emptyPreview=false;filter='all';sort='saved';persist();if(location.hash==='#saved'||!location.hash){view='saved';render()}else navigate('saved');notify('Demo reset to four saved products')};window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});route();
</script></body></html>
