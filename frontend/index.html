<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <meta name="robots" content="index,follow" />

    <meta name="theme-color" content="#b91c1c" />
    <link rel="canonical" href="https://www.uniqlotracker.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="https://www.uniqlotracker.com/" />
    <meta property="og:site_name" content="Uniqlo Price Tracker" />
    <meta property="og:title" content="Uniqlo Price Tracker — Sales &amp; Lowest Recorded Prices" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Uniqlo Price Tracker" />
    <meta name="twitter:description" content="Track Uniqlo prices in Canada, the United States, the United Kingdom, and Japan with daily updates. Spot deals and lowest recorded prices across every category — updated daily." />
    <meta name="twitter:image" content="https://www.uniqlotracker.com/social-card.png" />
    <meta name="twitter:image:alt" content="Uniqlo Price Tracker — Know the real low with daily recorded price history" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Uniqlo Price Tracker",
      "url": "https://www.uniqlotracker.com",
      "description": "A free price tracking tool for Uniqlo in Canada, the United States, the United Kingdom, and Japan. Monitors hundreds of Uniqlo products daily, highlights prices below their recorded typical price, tracks full price history, and flags lowest recorded prices across every category.",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CAD"
      },
      "areaServed": [
        {"@type": "Country", "name": "Canada"},
        {"@type": "Country", "name": "United States"},
        {"@type": "Country", "name": "United Kingdom"},
        {"@type": "Country", "name": "Japan"}
      ],
      "inLanguage": "en",
      "keywords": "Uniqlo price tracker, Uniqlo sale, Uniqlo price history, Uniqlo deals"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
