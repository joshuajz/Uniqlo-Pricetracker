name: Uniqlo API Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke-test:
    name: API smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test Uniqlo product API
        run: python scraper/api_smoke_test.py
