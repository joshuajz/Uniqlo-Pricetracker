name: Uniqlo Regional API Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke-test:
    name: API smoke test (${{ matrix.market }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
        market:
          - canada
          - uk
          - japan
          - us
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test Uniqlo product API (${{ matrix.market }})
        working-directory: scraper
        run: python smoke_test.py "${{ matrix.market }}"
