name: Uniqlo United States Price API Scraper

on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:


concurrency:
  group: uniqlo-us-scraper
  cancel-in-progress: false

jobs:
  scrape-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run scraper tests
        run: python -m unittest discover -s tests
      - name: Run United States scraper
        env:
          PYTHONUNBUFFERED: 1
        run: python us/main.py
      - name: Queue import and wait for completion
        env:
          AUTH_USER: ${{ secrets.AUTH_USER }}
          AUTH_PASS: ${{ secrets.AUTH_PASS }}
        run: python upload.py us/output.zip
