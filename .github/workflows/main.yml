name: Uniqlo Price Scraper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      include_images:
        description: Download and ingest product images
        required: false
        type: boolean
        default: false

jobs:
  scrape-latest:
    runs-on: macos-15
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.11
      - name: Initialize the project using uv
        run: uv sync --locked --all-extras --dev
      - name: Configure scrape mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%d)" == "01" ]]; then
            echo "SAVE_PHOTO=true" >> "$GITHUB_ENV"
          elif [[ "${{ inputs.include_images }}" == "true" ]]; then
            echo "SAVE_PHOTO=true" >> "$GITHUB_ENV"
          else
            echo "SAVE_PHOTO=false" >> "$GITHUB_ENV"
          fi
      - name: Run scraper
        env:
          PYTHONUNBUFFERED: 1
          CHROME_BINARY: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          HEADLESS: false
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          uv run main.py
      - name: Make an API Request to store the scraped results
        run: |
          curl --fail-with-body --show-error -X POST -F "file=@output.zip" -u "${{secrets.AUTH_USER}}:${{secrets.AUTH_PASS}}" https://api.uniqlotracker.com/api/products/injest
